# Héliciculture du Garnoutey : site statique, généré par build.py (ne pas modifier à la main : relancer la construction).
# Installation : copier ce fichier dans /etc/nginx/sites-available/garnoutey, remplacer DOMAINE et le chemin du
# dossier « site », activer (ln -s vers sites-enabled), vérifier avec « nginx -t », recharger nginx,
# puis HTTPS avec « certbot --nginx -d DOMAINE ».
server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;
    root /var/www/garnoutey/site;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-7mkZQH/3O4pnndeVi6KhfpyYa/QM+odAYolr8KFPQ+I='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    error_page 404 /404.html;

    location = /elevage { return 301 /l-elevage; }
    location = /escargots { return 301 /nos-escargots; }
    location = /produits { return 301 /nos-escargots; }
    location = /commander { return 301 /contact; }
    location = /commande { return 301 /contact; }
    location = /recette { return 301 /recettes; }

    location ^~ /assets/ { expires 1y; try_files $uri =404; }
    location ^~ /fonts/  { expires 1y; try_files $uri =404; }
    location ^~ /img/    { expires 7d; try_files $uri =404; }
    location ^~ /video/  { expires 7d; try_files $uri =404; }
    location ~ \.webmanifest$ { types { application/manifest+json webmanifest; } try_files $uri =404; }

    # adresses sans « .html » (/contact sert contact.html)
    location / { try_files $uri $uri.html $uri/ =404; }
}
